name: Deploy Sphinx Documentation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme
          # Looks for requirements in the project root; move into docs/ if needed
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Change directory to docs/ and use the Makefile to generate HTML
      - name: Build Sphinx Documentation
        run: |
          cd docs
          make html

      # Deploy the output directory created by the Makefile
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html  # Makefile defaults to generating HTML here
